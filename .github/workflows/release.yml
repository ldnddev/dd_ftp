name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to attach packages to (e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev libdbus-1-dev zlib1g-dev

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release -p dd_ftp_cli --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          COPYFILE_DISABLE: "1"
          COPY_EXTENDED_ATTRIBUTES_DISABLE: "1"
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          stage="$(mktemp -d)"
          mkdir -p dist

          if [[ "$target" == *windows* ]]; then
            src="target/${target}/release/dd_ftp_cli.exe"
            test -f "$src"
            cp "$src" "${stage}/dd_ftp.exe"
          else
            src="target/${target}/release/dd_ftp_cli"
            test -x "$src"
            cp "$src" "${stage}/dd_ftp"
            chmod 0755 "${stage}/dd_ftp"
          fi
          cp dd_ftp_theme.yml "${stage}/dd_ftp_theme.yml"

          if [[ "$target" == *windows* ]]; then
            tar -C "$stage" -czf "dist/dd_ftp-${target}.tar.gz" dd_ftp.exe dd_ftp_theme.yml
          else
            tar -C "$stage" -czf "dist/dd_ftp-${target}.tar.gz" dd_ftp dd_ftp_theme.yml
          fi
          rm -rf "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: dd_ftp-${{ matrix.target }}
          path: dist/dd_ftp-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: dd_ftp-*

      - name: Checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          archives=(dd_ftp-*.tar.gz)
          [[ ${#archives[@]} -gt 0 ]] || { echo "no packages downloaded"; exit 1; }
          sha256sum "${archives[@]}" > SHA256SUMS
          cp ../install.sh .
          sha256sum install.sh >> SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          shopt -s nullglob
          files=(dist/dd_ftp-*.tar.gz dist/SHA256SUMS dist/install.sh)
          [[ ${#files[@]} -gt 2 ]] || { echo "no packages to upload"; exit 1; }

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --generate-notes --title "$tag"
          fi
