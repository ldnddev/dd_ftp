# Publish docs/index.html as https://ldnddev.github.io/dd_ftp/
name: GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/index.html"
      - "docs/images/**"
      - "docs/.nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage tutorial site
        run: |
          mkdir -p _site/images
          cp docs/index.html docs/.nojekyll _site/
          cp docs/images/*.png _site/images/
          test -f _site/index.html
          test -f _site/images/01-main.png

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
