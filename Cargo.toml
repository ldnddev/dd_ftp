[workspace]
members = [
  "crates/dd_ftp_cli",
  "crates/dd_ftp_app",
  "crates/dd_ftp_ui",
  "crates/dd_ftp_core",
  "crates/dd_ftp_ftp",
  "crates/dd_ftp_protocols",
  "crates/dd_ftp_transfer",
  "crates/dd_ftp_storage",
  "crates/ldnddev_theme",
]
resolver = "2"

[workspace.package]
version = "1.6.1"
edition = "2021"
authors = ["ldnddev"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
ldnddev_theme = { path = "crates/ldnddev_theme" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

# protocol backends (reserved for implementation)
ssh2 = "0.9"
async_ftp = { version = "6", features = ["secure"] }
tokio-rustls = "0.23"
webpki-roots = "0.22"

# utility
keyring = { version = "3", features = ["linux-native-sync-persistent", "apple-native", "windows-native"] }

[profile.release]
# "z" is smaller than "s" on this tree (4.09 MiB vs 4.22 MiB, x86_64 GNU).
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
debug = true
incremental = true